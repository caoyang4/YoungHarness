<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YoungHarness Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; background: #f5f6f8; color: #222; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e3e5e8;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 16px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 760px; margin: 0 auto 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; max-width: 85%; }
  .user .bubble { background: #2f6fed; color: #fff; }
  .assistant .bubble { background: #fff; border: 1px solid #e3e5e8; }
  .bubble.error { color: #c0392b; }
  .tool { max-width: 760px; margin: 0 auto 14px; font-size: 13px; color: #555; }
  .tool summary { cursor: pointer; }
  .tool pre { margin: 6px 0 0; padding: 8px 10px; background: #eceef1; border-radius: 6px;
              white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
  .tool.err summary { color: #c0392b; }
  form { padding: 14px 20px; background: #fff; border-top: 1px solid #e3e5e8; }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; padding: 10px 12px; border: 1px solid #ccd0d5; border-radius: 8px; font: inherit; }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: #2f6fed; color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: #555; border: 1px solid #ccd0d5; padding: 4px 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>YoungHarness Chat</h1>
  <button class="ghost" id="clear" type="button">清空对话</button>
</header>
<div id="log"></div>
<form id="form">
  <div class="row">
    <textarea id="input" rows="2" placeholder="输入消息,Enter 发送,Shift+Enter 换行" autofocus></textarea>
    <button id="send" type="submit">发送</button>
  </div>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const csrf = "{{ csrf_token }}";
let history = [];

function addMsg(role, text, isError) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

// Parse one SSE block ("event: x\ndata: {...}") into {event, data}.
function parseBlock(block) {
  let event = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  return { event, data: data ? JSON.parse(data) : {} };
}

async function ask(text) {
  history.push({ role: "user", content: text });
  addMsg("user", text);
  // A turn can interleave text and tool calls: each text run gets its own bubble.
  let bubble = addMsg("assistant", "…");
  let fresh = true;
  const parts = [];
  const tools = {};
  send.disabled = true;
  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
      body: JSON.stringify({ messages: history }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const blocks = buf.split("\n\n");
      buf = blocks.pop();
      for (const block of blocks) {
        if (!block.trim()) continue;
        const { event, data } = parseBlock(block);
        if (event === "error") throw new Error(data.error);
        if (event === "message") {
          if (!bubble) { bubble = addMsg("assistant", ""); parts.push(""); }
          if (fresh) { bubble.textContent = ""; fresh = false; parts.push(""); }
          parts[parts.length - 1] += data.text;
          bubble.textContent = parts[parts.length - 1];
        } else if (event === "tool_use") {
          if (fresh && bubble) bubble.parentNode.remove();
          fresh = false;
          bubble = null;
          tools[data.id] = addTool(data);
        } else if (event === "tool_result") {
          fillTool(tools[data.id], data);
        }
        log.scrollTop = log.scrollHeight;
      }
    }
    const reply = parts.filter(Boolean).join("\n\n");
    if (!reply) throw new Error("没有收到回复");
    history.push({ role: "assistant", content: reply });
  } catch (e) {
    history.pop();  // drop the unanswered user turn so history stays alternating
    const target = bubble || addMsg("assistant", "");
    target.textContent = "出错了:" + e.message;
    target.classList.add("error");
  } finally {
    send.disabled = false;
    input.focus();
  }
}

function addTool(ev) {
  const box = document.createElement("details");
  box.className = "tool";
  const sum = document.createElement("summary");
  sum.textContent = "🔧 " + ev.name + " " + JSON.stringify(ev.input) + " …";
  const pre = document.createElement("pre");
  box.append(sum, pre);
  log.appendChild(box);
  return box;
}

function fillTool(box, ev) {
  if (!box) return;
  box.querySelector("summary").textContent =
    (ev.is_error ? "⚠️ " : "🔧 ") + ev.name + (ev.is_error ? " 失败" : " 完成");
  box.querySelector("pre").textContent = ev.content;
  box.classList.toggle("err", ev.is_error);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  ask(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    form.requestSubmit();
  }
});
document.getElementById("clear").addEventListener("click", () => {
  history = [];
  log.innerHTML = "";
});
</script>
</body>
</html>
